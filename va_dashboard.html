let currentVA = null;

function formatDuration(seconds) {
  if (!seconds) return "0s";
  const m = Math.floor(seconds / 60);
  const s = Math.round(seconds % 60);
  return m > 0 ? `${m}m ${s}s` : `${s}s`;
}

async function refreshData() {
  const btn = document.querySelector(".refresh-btn");
  const original = btn.textContent;
  btn.textContent = "Refreshing...";
  btn.disabled = true;
  try {
    const resp = await fetch("/refresh");
    const result = await resp.json();
    if (result.status === "ok") {
      alert("Data refreshed successfully. Reloading...");
      location.reload();
    } else {
      alert("Refresh failed: " + (result.message || "Unknown error"));
    }
  } catch (e) {
    alert("Could not reach refresh server. Make sure the server is running.\n\nError: " + e.message);
  } finally {
    btn.textContent = original;
    btn.disabled = false;
  }
}

function getFiltered() {
  const range = document.getElementById("range").value;
  const custom = document.getElementById("customDate").value;
  const now = new Date();
  let cutoff = null;
  let label = "";

  if (range === "custom" && custom) {
    const d = new Date(custom);
    cutoff = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const next = new Date(cutoff);
    next.setDate(next.getDate() + 1);
    label = custom;
    return {
      calls: RAW.calls.filter(c => {
        const cd = new Date(c.date_only);
        return cd >= cutoff && cd < next;
      }),
      transfers: RAW.transfers.filter(t => {
        const td = new Date(t.date_only);
        return td >= cutoff && td < next;
      }),
      single_dials: RAW.single_dials.filter(s => {
        const sd = new Date(s.date_only);
        return sd >= cutoff && sd < next;
      }),
      label
    };
  }

  const days = parseInt(range) || 14;
  cutoff = new Date(now);
  cutoff.setDate(cutoff.getDate() - days);
  label = `Last ${days} days`;
  return {
    calls: RAW.calls.filter(c => new Date(c.date_only) >= cutoff),
    transfers: RAW.transfers.filter(t => new Date(t.date_only) >= cutoff),
    single_dials: RAW.single_dials.filter(s => new Date(s.date_only) >= cutoff),
    label
  };
}

function computeSummary(calls, transfers, singleDials) {
  const summary = {};
  calls.forEach(c => {
    if (!summary[c.va]) summary[c.va] = { calls: 0, talk_seconds: 0, by_location: {}, transfers: 0, single_dials: 0 };
    summary[c.va].calls++;
    summary[c.va].talk_seconds += c.duration_sec || 0;
    summary[c.va].by_location[c.location] = (summary[c.va].by_location[c.location] || 0) + 1;
  });
  transfers.forEach(t => {
    const va = t.va || "Unknown";
    if (!summary[va]) summary[va] = { calls: 0, talk_seconds: 0, by_location: {}, transfers: 0, single_dials: 0 };
    summary[va].transfers++;
  });
  singleDials.forEach(s => {
    const va = s.va;
    if (!summary[va]) summary[va] = { calls: 0, talk_seconds: 0, by_location: {}, transfers: 0, single_dials: 0 };
    summary[va].single_dials++;
  });
  return summary;
}

function renderOverview() {
  currentVA = null;
  const { calls, transfers, single_dials, label } = getFiltered();
  document.getElementById("range-label").textContent = `${label} • ${calls.length} calls • ${transfers.length} transfers • ${single_dials.length} single dials`;

  const summary = computeSummary(calls, transfers, single_dials);
  const vas = Object.keys(summary).sort((a,b) => (summary[b].calls || 0) - (summary[a].calls || 0));

  let html = `<div class="section"><h2>Overview</h2>`;
  if (vas.length === 0) {
    html += `<p>No data in this range.</p>`;
  } else {
    vas.forEach(va => {
      const s = summary[va];
      html += `
        <div class="va-card" onclick="showVA('${va.replace(/'/g, "\\'")}')">
          <div>
            <strong>${va}</strong><br>
            <span style="color:#666; font-size:13px;">${s.calls} calls • ${formatDuration(s.talk_seconds)} • ${s.transfers} transfers • <span class="flag">${s.single_dials} single dials</span></span>
          </div>
          <div style="color:#1a73e8; font-size:13px;">View details →</div>
        </div>`;
    });
  }
  html += `</div>`;
  document.getElementById("content").innerHTML = html;
  updateTabs();
}

function showVA(va) {
  currentVA = va;
  const { calls, transfers, single_dials } = getFiltered();
  const vaCalls = calls.filter(c => c.va === va).sort((a,b) => b.date.localeCompare(a.date));
  const vaTransfers = transfers.filter(t => t.va === va).sort((a,b) => b.date.localeCompare(a.date));
  const vaSingle = single_dials.filter(s => s.va === va).sort((a,b) => b.date.localeCompare(a.date));
  const summary = computeSummary(vaCalls, vaTransfers, vaSingle)[va] || { calls: 0, talk_seconds: 0, by_location: {}, transfers: 0, single_dials: 0 };

  const locRows = Object.entries(summary.by_location)
    .sort((a,b) => b[1] - a[1])
    .map(([loc, count]) => `<tr><td>${loc}</td><td>${count}</td></tr>`).join("");

  const recentCalls = vaCalls.slice(0, 30).map(c => `
    <tr>
      <td>${c.lead_name || "Unknown"}</td>
      <td>${c.date}</td>
      <td>${c.location}</td>
      <td>${formatDuration(c.duration_sec)}</td>
      <td>${c.status}</td>
    </tr>`).join("");

  const recentTransfers = vaTransfers.slice(0, 12).map(t => `
    <tr>
      <td>${t.date}</td>
      <td>${t.location}</td>
      <td>${(t.text_preview || "").replace(/</g, "<")}</td>
    </tr>`).join("");

  const singleRows = vaSingle.slice(0, 25).map(s => `
    <tr>
      <td>${s.lead_name || "Unknown"}</td>
      <td>${s.date}</td>
      <td>${s.location}</td>
      <td>${formatDuration(s.duration_sec)}</td>
      <td>${s.status}</td>
    </tr>`).join("");

  document.getElementById("content").innerHTML = `
    <div class="cards">
      <div class="card">
        <div class="label">Total Calls</div>
        <div class="value">${summary.calls}</div>
      </div>
      <div class="card">
        <div class="label">Talk Time</div>
        <div class="value">${formatDuration(summary.talk_seconds)}</div>
      </div>
      <div class="card">
        <div class="label">Transfers</div>
        <div class="value">${summary.transfers}</div>
      </div>
      <div class="card warn">
        <div class="label">Single Dials</div>
        <div class="value">${summary.single_dials}</div>
      </div>
    </div>

    <div class="section">
      <h2>Calls by Account</h2>
      <table>
        <thead><tr><th>Location</th><th>Outbound Calls</th></tr></thead>
        <tbody>${locRows || '<tr><td colspan="2">No data</td></tr>'}</tbody>
      </table>
    </div>

    <div class="section">
      <h2>Single-Dial Leads <span class="flag">(need second dial)</span></h2>
      <table>
        <thead><tr><th>Lead Name</th><th>Date</th><th>Location</th><th>Duration</th><th>Status</th></tr></thead>
        <tbody>${singleRows || '<tr><td colspan="5">None in this range</td></tr>'}</tbody>
      </table>
    </div>

    <div class="section">
      <h2>Recent Calls</h2>
      <table>
        <thead><tr><th>Lead Name</th><th>Date</th><th>Location</th><th>Duration</th><th>Status</th></tr></thead>
        <tbody>${recentCalls || '<tr><td colspan="5">No calls</td></tr>'}</tbody>
      </table>
    </div>

    <div class="section">
      <h2>Transfers</h2>
      <table>
        <thead><tr><th>Date</th><th>Location</th><th>Preview</th></tr></thead>
        <tbody>${recentTransfers || '<tr><td colspan="3">No transfers in this range</td></tr>'}</tbody>
      </table>
    </div>
  `;
  updateTabs();
}

function updateTabs() {
  const { calls, transfers, single_dials } = getFiltered();
  const summary = computeSummary(calls, transfers, single_dials);
  const vas = ["Overview", ...Object.keys(summary).sort()];
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = vas.map(v => {
    const active = (v === "Overview" && !currentVA) || v === currentVA ? " active" : "";
    const onclick = v === "Overview" ? "renderOverview()" : `showVA('${v.replace(/'/g, "\\'")}')`;
    return `<div class="tab${active}" onclick="${onclick}">${v}</div>`;
  }).join("");
}

function applyFilter() {
  if (currentVA) showVA(currentVA);
  else renderOverview();
}

document.getElementById("range").addEventListener("change", function() {
  document.getElementById("customDate").style.display = this.value === "custom" ? "inline-block" : "none";
});

renderOverview();
</script>
</body>
</html>
